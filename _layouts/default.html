<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {{ content }}
  <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} {{ site.title }}. All rights reserved.</span><span>Unless otherwise stated, all photographs on this website are my original work. All rights reserved.</span></footer>
  <script src="{{ '/assets/js/tabs.js' | relative_url }}" defer></script>
</body>
</html>
