---
layout: default
---
<article class="prose-panel article-page">
  <a class="back-link" href="{{ '/' | relative_url }}#blog">← All posts</a>
  <p class="eyebrow">{{ page.date | date: "%B %d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  <div class="article-body">{{ content }}</div>
</article>
